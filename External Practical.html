<!DOCTYPE html>
<html>
<body>

Number of Subjects:
<input type="number" id="n">
<button onclick="create()">Enter Marks</button>

<div id="marks"></div>
<button onclick="calc()">Calculate</button>

<p id="result"></p>

<script>
function create() {
    let n = document.getElementById("n").value, s = "";
    for (let i = 1; i <= n; i++)
        s += "Subject " + i + ": <input class='m'><br>";
    document.getElementById("marks").innerHTML = s;
}

function calc() {
    let m = document.getElementsByClassName("m");
    let total = 0, pass = true;

    for (let i = 0; i < m.length; i++) {
        total += Number(m[i].value);
        if (m[i].value < 35) pass = false;
    }

    let avg = total / m.length;
    let grade = avg >= 90 ? "A+" :
                avg >= 80 ? "A" :
                avg >= 70 ? "B" :
                avg >= 60 ? "C" :
                avg >= 50 ? "D" : "F";

    document.getElementById("result").innerHTML =
        "Total = " + total +
        "<br>Average = " + avg.toFixed(2) +
        "<br>Grade = " + grade +
        "<br>Result = " + (pass ? "PASS" : "FAIL");
}
</script>

</body>
</html>
